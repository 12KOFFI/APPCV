framework:
    http_client:
        scoped_clients:
            claude.client:
                base_uri: 'https://api.anthropic.com'
                headers:
                    x-api-key: '%env(CLAUDE_API_KEY)%'
                    anthropic-version: '2023-06-01'
                timeout: 30
                max_duration: 90
                retry_failed:
                    max_retries: 2
                    http_codes: [429, 500, 502, 503, 529]
