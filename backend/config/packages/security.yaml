security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        connexion:
            pattern: ^/api/connexion
            stateless: true
            user_checker: App\Security\UserChecker
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            json_login:
                check_path: api_connexion
                username_path: email
                password_path: motDePasse
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            jwt: ~

    access_control:
        - { path: ^/api/connexion, roles: PUBLIC_ACCESS }
        - { path: ^/api/inscription, roles: PUBLIC_ACCESS }
        - { path: ^/api/sante, roles: PUBLIC_ACCESS }
        - { path: ^/api/cv$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/api/admin, roles: ROLE_ADMIN }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
